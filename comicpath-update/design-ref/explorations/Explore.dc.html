<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight linked cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#2747C9}a:hover{color:#1B3496}
</style>
</helmet>
<div style="width: 1200px; height: 900px; box-sizing: border-box; padding: 48px; background: #EEF0EC; font-family: 'IBM Plex Sans', sans-serif; color: #15171A; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4E545C">Showing {{relCount}} links for</div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px">{{selTitle}}</h2>
</div>
<div style="display: flex; gap: 16px; align-items: center; font-size: 13px; color: #3D434A">
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2747C9"></span>Story order</div>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #C2541A"></span>Creators</div>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6B7179"></span>Era</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<article style="background: #FFFFFF; border: 2px solid {{c.border}}; border-radius: 14px; opacity: {{c.opacity}}; display: flex; flex-direction: column; transition: opacity 160ms, border-color 160ms">
<div style="height: 36px; padding: 14px 20px 0; display: flex; align-items: center">
<sc-if value="{{c.isSelected}}" hint-placeholder-val="{{ false }}">
<span style="padding: 4px 10px; border-radius: 999px; background: #15171A; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase">Selected</span>
</sc-if>
<sc-if value="{{c.isRelated}}" hint-placeholder-val="{{ false }}">
<span style="padding: 4px 10px; border-radius: 999px; background: {{c.badgeBg}}; color: {{c.badgeFg}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase">{{c.rel}}</span>
</sc-if>
</div>
<div style="padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #4E545C">{{c.meta}}</div>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.15">{{c.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3D434A">{{c.desc}}</p>
</div>
<div style="margin-top: auto; border-top: 1px solid #E4E7E1; padding: 6px 8px; display: flex; align-items: center; gap: 4px">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 0; background: {{c.linkBg}}; border-radius: 8px; color: #2747C9; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>{{c.linkLabel}}</button>
<div style="flex-grow: 1"></div>
<button type="button" aria-label="Save" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: #3D434A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg></button>
<a href="#" style="height: 44px; padding: 0 18px; display: flex; align-items: center; border-radius: 8px; background: #15171A; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">Open</a>
</div>
</article>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
var CARDS = [
  { id: 'y1', title: 'Batman: Year One', meta: 'Miller · Mazzucchelli · 1987', desc: "Bruce Wayne's first year as Batman, told alongside Jim Gordon's first year in Gotham." },
  { id: 'lh', title: 'The Long Halloween', meta: 'Loeb · Sale · 1996–97', desc: 'A year-long mystery as a killer strikes Gotham on each holiday.' },
  { id: 'dv', title: 'Dark Victory', meta: 'Loeb · Sale · 1999–2000', desc: 'The sequel to The Long Halloween, introducing Dick Grayson as Robin.' },
  { id: 'ba', title: 'Daredevil: Born Again', meta: 'Miller · Mazzucchelli · 1986', desc: "The Kingpin learns Matt Murdock's secret identity and sets out to destroy him." },
  { id: 'dkr', title: 'The Dark Knight Returns', meta: 'Miller · 1986', desc: 'An aging Bruce Wayne comes out of retirement in a near-future Gotham.' },
  { id: 'wm', title: 'Watchmen', meta: 'Moore · Gibbons · 1986–87', desc: 'A murder investigation unravels a conspiracy among retired costumed heroes.' }
];
var EDGES = [
  ['y1', 'lh', 'Read next', 'Comes before', 'seq'],
  ['lh', 'dv', 'Sequel', 'Prequel', 'seq'],
  ['y1', 'ba', 'Same team', 'Same team', 'team'],
  ['y1', 'dkr', 'Same writer', 'Same writer', 'team'],
  ['ba', 'dkr', 'Same writer', 'Same writer', 'team'],
  ['dkr', 'wm', 'Same year', 'Same year', 'era']
];
var KIND = {
  seq: { fg: '#2747C9', bg: '#E8ECFB', border: '#2747C9' },
  team: { fg: '#9A3F0E', bg: '#FBEDE4', border: '#C2541A' },
  era: { fg: '#3D434A', bg: '#E6E8E3', border: '#6B7179' }
};
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var sel = (this.state && this.state.sel) || 'y1';
    var rels = {};
    var counts = {};
    EDGES.forEach(function (e) {
      counts[e[0]] = (counts[e[0]] || 0) + 1;
      counts[e[1]] = (counts[e[1]] || 0) + 1;
      if (e[0] === sel) rels[e[1]] = { label: e[2], k: e[4] };
      if (e[1] === sel) rels[e[0]] = { label: e[3], k: e[4] };
    });
    var cards = CARDS.map(function (c) {
      var isSel = c.id === sel;
      var r = rels[c.id];
      var kind = r ? KIND[r.k] : null;
      var n = counts[c.id] || 0;
      return {
        id: c.id, title: c.title, meta: c.meta, desc: c.desc,
        isSelected: isSel,
        isRelated: !!r,
        rel: r ? r.label : '',
        badgeFg: kind ? kind.fg : '#3D434A',
        badgeBg: kind ? kind.bg : '#E6E8E3',
        border: isSel ? '#15171A' : (kind ? kind.border : '#DDE0DA'),
        opacity: (isSel || r) ? '1' : '0.5',
        pressed: isSel ? 'true' : 'false',
        linkBg: isSel ? '#E8ECFB' : 'transparent',
        linkLabel: n + (n === 1 ? ' link' : ' links'),
        pick: function () { self.setState({ sel: c.id }); }
      };
    });
    var selCard = CARDS.filter(function (c) { return c.id === sel; })[0];
    return { cards: cards, selTitle: selCard.title, relCount: Object.keys(rels).length };
  }
}
</script>
</body>
</html>
