<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radial link overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#2747C9}a:hover{color:#1B3496}
</style>
</helmet>
<div style="width: 1520px; height: 1040px; box-sizing: border-box; padding: 20px 40px; background: #EEF0EC; font-family: 'IBM Plex Sans', sans-serif; color: #15171A; display: flex; gap: 40px; align-items: center">

<div style="width: 1000px; height: 1000px; flex-shrink: 0; position: relative">
<div style="position: absolute; left: 170px; top: 170px; width: 660px; height: 660px; box-sizing: border-box; border: 1px dashed #C9CEC6; border-radius: 50%"></div>

<sc-for list="{{lines}}" as="l" hint-placeholder-count="24">
<div style="position: absolute; left: 500px; top: 499px; width: {{l.len}}px; height: 2px; background: {{l.color}}; transform-origin: 0 50%; transform: rotate({{l.deg}}deg)"></div>
</sc-for>

<sc-for list="{{nodes}}" as="n" hint-placeholder-count="24">
<div style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: {{n.size}}px; height: {{n.size}}px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{n.border}}; background: {{n.fill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px">
<sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}"><span>{{n.num}}</span></sc-if>
</div>
</sc-for>

<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; transform: translate(-50%, -50%); min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 500; white-space: nowrap">{{t.label}}<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; opacity: 0.85">{{t.count}}</span></button>
</sc-for>

<article style="position: absolute; left: 380px; top: 435px; width: 240px; height: 130px; box-sizing: border-box; padding: 16px 18px; background: #FFFFFF; border: 2px solid #15171A; border-radius: 14px; box-shadow: 0 8px 24px rgba(21, 23, 26, 0.12); display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #4E545C">Miller · Mazzucchelli · 1987</div>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.15">Batman: Year One</h3>
<div style="margin-top: auto; font-size: 13px; color: #2747C9; font-weight: 500">{{total}} links</div>
</article>
</div>

<aside style="flex-grow: 1; min-width: 0; align-self: stretch; padding: 40px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{activeFg}}"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{activeColor}}"></span>{{activeCount}} of {{total}} links</div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px">{{activeLabel}}</h2>
<div style="font-size: 15px; color: #3D434A">{{activeSub}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{list}}" as="it" hint-placeholder-count="8">
<a href="#" style="min-height: 56px; box-sizing: border-box; padding: 8px 12px; background: #FFFFFF; border: 1px solid #DDE0DA; border-radius: 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #15171A">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: {{activeBadge}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{it.num}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">{{it.title}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4E545C">{{it.year}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</aside>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1520,"height":1040}}'>
var GROUPS = [
  { id: 'seq', label: 'Story order', sub: 'Early-career Batman stories', kind: 'seq', items: [
    ['The Long Halloween', '1996–97'], ['Dark Victory', '1999–2000'], ['Haunted Knight', '1996'],
    ['Catwoman: When in Rome', '2004–05'], ['Batman: The Man Who Laughs', '2005'],
    ['Batman and the Monster Men', '2006'], ['Batman and the Mad Monk', '2006–07'] ] },
  { id: 'writer', label: 'Same writer', sub: 'Frank Miller', kind: 'team', items: [
    ['The Dark Knight Returns', '1986'], ['Daredevil: Born Again', '1986'], ['Ronin', '1983–84'],
    ['Elektra: Assassin', '1986–87'], ['Sin City: The Hard Goodbye', '1991–92'],
    ['Daredevil: The Man Without Fear', '1993'], ['300', '1998'], ['The Dark Knight Strikes Again', '2001–02'] ] },
  { id: 'artist', label: 'Same artist', sub: 'David Mazzucchelli', kind: 'team', items: [
    ['Rubber Blanket', '1991–93'], ['City of Glass', '1994'], ['Asterios Polyp', '2009'] ] },
  { id: 'era', label: 'Same era', sub: 'Published 1985–89', kind: 'era', items: [
    ['Crisis on Infinite Earths', '1985–86'], ['The Man of Steel', '1986'], ['Maus I', '1986'],
    ['Watchmen', '1986–87'], ['Batman: The Killing Joke', '1988'], ['Batman: A Death in the Family', '1988–89'] ] }
];
var KIND = {
  seq: { color: '#2747C9', badge: '#2747C9', fg: '#2747C9' },
  team: { color: '#C2541A', badge: '#9A3F0E', fg: '#9A3F0E' },
  era: { color: '#6B7179', badge: '#4E545C', fg: '#4E545C' }
};
var CX = 500, CY = 500, R = 330, LR = 430, GAP = 1.5;
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var active = (this.state && this.state.g) || 'writer';
    var total = 0;
    GROUPS.forEach(function (g) { total += g.items.length; });
    var step = 360 / (total + GAP * GROUPS.length);
    var slot = GAP / 2;
    var nodes = [], linesOff = [], linesOn = [], tabs = [];
    GROUPS.forEach(function (g) {
      var k = KIND[g.kind];
      var on = g.id === active;
      var start = slot;
      g.items.forEach(function (it, i) {
        var deg = -90 + slot * step;
        var rad = deg * Math.PI / 180;
        var size = on ? 28 : 12;
        nodes.push({
          x: Math.round(CX + R * Math.cos(rad) - size / 2),
          y: Math.round(CY + R * Math.sin(rad) - size / 2),
          size: size, active: on, num: i + 1,
          fill: on ? k.badge : '#FFFFFF',
          border: on ? k.badge : '#A9AFA7'
        });
        var line = { deg: deg.toFixed(2), len: R - size / 2, color: on ? k.color : '#D3D7D0' };
        (on ? linesOn : linesOff).push(line);
        slot += 1;
      });
      var mid = (-90 + ((start + slot - 1) / 2) * step) * Math.PI / 180;
      tabs.push({
        label: g.label, count: g.items.length,
        x: Math.round(CX + LR * Math.cos(mid)), y: Math.round(CY + LR * Math.sin(mid)),
        pressed: on ? 'true' : 'false',
        bg: on ? k.badge : '#FFFFFF', fg: on ? '#FFFFFF' : '#15171A', border: on ? k.badge : '#C9CEC6',
        pick: function () { self.setState({ g: g.id }); }
      });
      slot += GAP;
    });
    var ag = GROUPS.filter(function (g) { return g.id === active; })[0];
    var ak = KIND[ag.kind];
    return {
      total: total, nodes: nodes, lines: linesOff.concat(linesOn), tabs: tabs,
      activeLabel: ag.label, activeSub: ag.sub, activeCount: ag.items.length,
      activeColor: ak.color, activeBadge: ak.badge, activeFg: ak.fg,
      list: ag.items.map(function (it, i) { return { num: i + 1, title: it[0], year: it[1] }; })
    };
  }
}
</script>
</body>
</html>
