<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expand a linked card in place</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#2747C9}a:hover{color:#1B3496}
</style>
</helmet>
<div style="width: 1520px; min-height: 1400px; box-sizing: border-box; padding: 48px 56px 56px; background: #EEF0EC; font-family: 'IBM Plex Sans', sans-serif; color: #15171A; display: flex; flex-direction: column; gap: 28px">

<nav aria-label="Exploration path" style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 44px">
<sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="1">
<sc-if value="{{cr.notFirst}}" hint-placeholder-val="{{ false }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7179" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</sc-if>
<sc-if value="{{cr.isLast}}" hint-placeholder-val="{{ true }}">
<span aria-current="page" style="padding: 0 10px; font-size: 15px; font-weight: 600">{{cr.title}}</span>
</sc-if>
<sc-if value="{{cr.notLast}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{cr.go}}" style="height: 44px; padding: 0 10px; border: 0; background: transparent; border-radius: 8px; color: #2747C9; font-size: 15px; font-weight: 500">{{cr.title}}</button>
</sc-if>
</sc-for>
</nav>

<div style="display: flex; gap: 80px; align-items: flex-start">

<div style="width: 340px; flex-shrink: 0; position: relative">
<div style="position: absolute; left: 100%; top: 27px; width: 40px; height: 2px; background: #A9AFA7"></div>
<article style="background: #FFFFFF; border: 2px solid #15171A; border-radius: 14px; box-shadow: 0 8px 24px rgba(21, 23, 26, 0.10); display: flex; flex-direction: column">
<div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #4E545C">{{focusMeta}}</div>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.12">{{focusTitle}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3D434A">{{focusDesc}}</p>
</div>
<div style="border-top: 1px solid #E4E7E1; padding: 6px 8px; display: flex; align-items: center; gap: 4px">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 0; background: #E8ECFB; border-radius: 8px; color: #2747C9; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>{{focusCount}} links</button>
<div style="flex-grow: 1"></div>
<button type="button" aria-label="Save" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: #3D434A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg></button>
<a href="#" style="height: 44px; padding: 0 18px; display: flex; align-items: center; border-radius: 8px; background: #15171A; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">Open</a>
</div>
</article>
</div>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 32px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="position: relative; display: flex; flex-direction: column; gap: 12px">
<div style="position: absolute; left: -40px; top: {{g.trunkTop}}; width: 2px; height: {{g.trunkH}}; background: #A9AFA7"></div>
<div style="position: absolute; left: -40px; top: 27px; width: 40px; height: 2px; background: {{g.color}}"></div>
<div style="height: 56px; display: flex; align-items: center; gap: 12px">
<span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 16px; background: {{g.badge}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{g.count}}</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600">{{g.label}}</div>
<div style="font-size: 13px; color: #4E545C">{{g.sub}}</div>
</div>
<div style="flex-grow: 1"></div>
<sc-if value="{{g.canCollapse}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{g.collapse}}" style="height: 44px; padding: 0 14px; border: 0; background: transparent; border-radius: 8px; color: #2747C9; font-size: 14px; font-weight: 500">Show less</button>
</sc-if>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{g.cells}}" as="c" hint-placeholder-count="4">

<sc-if value="{{c.isChip}}" hint-placeholder-val="{{ true }}">
<div style="min-height: 116px; box-sizing: border-box; padding: 12px 14px 4px; background: {{c.bg}}; border: 2px solid {{c.border}}; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; color: {{c.fg}}">
<a href="#" style="font-size: 15px; font-weight: 600; line-height: 1.25; color: {{c.fg}}; text-decoration: none">{{c.title}}</a>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{c.sub}}">{{c.year}}</span>
<div style="margin-top: auto; min-height: 44px; display: flex; align-items: center; gap: 8px">
<sc-if value="{{c.expandable}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{c.toggle}}" aria-expanded="{{c.ariaExp}}" style="height: 44px; margin-left: -10px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; border-radius: 8px; color: {{c.btnFg}}; font-size: 13px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><circle cx="18" cy="8" r="2.5"></circle><path d="M6 8.5v3a3 3 0 0 0 3 3h6.5"></path><path d="M8.5 6h7"></path></svg>{{c.expLabel}}</button>
</sc-if>
<sc-if value="{{c.hasTag}}" hint-placeholder-val="{{ false }}">
<span style="padding: 3px 8px; border-radius: 4px; background: #E6E8E3; color: #3D434A; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase">{{c.tag}}</span>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{c.isMore}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{c.expand}}" style="min-height: 116px; box-sizing: border-box; padding: 12px 14px; background: transparent; border: 1px dashed #A9AFA7; border-radius: 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; color: #15171A; text-align: left">
<span style="font-size: 15px; font-weight: 600">+{{c.more}} more</span>
<span style="font-size: 13px; color: #4E545C">Show all {{c.count}}</span>
</button>
</sc-if>

<sc-if value="{{c.isPanel}}" hint-placeholder-val="{{ false }}">
<div style="grid-column: 1 / -1; position: relative; margin-top: 6px; padding: 20px 20px 24px; background: #FFFFFF; border: 2px solid #15171A; border-radius: 14px; box-shadow: 0 10px 28px rgba(21, 23, 26, 0.10); display: flex; flex-direction: column; gap: 18px">
<div style="position: absolute; top: -10px; left: calc((100% + 4px - 36px) / 4 * {{c.col}} + {{c.gapPx}}px + (100% + 4px - 36px) / 8 - 10px); width: 16px; height: 16px; background: #FFFFFF; border-top: 2px solid #15171A; border-left: 2px solid #15171A; transform: rotate(45deg)"></div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4E545C">Expanded from {{c.from}} · {{c.count}} links</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">{{c.title}}</div>
</div>
<div style="flex-grow: 1"></div>
<button type="button" onClick="{{c.focus}}" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 8px; border: 1px solid #C9CEC6; background: #FFFFFF; color: #15171A; font-size: 14px; font-weight: 500">Make this the focus<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
<button type="button" onClick="{{c.close}}" aria-label="Collapse {{c.title}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 8px; color: #3D434A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{c.groups}}" as="sg" hint-placeholder-count="3">
<div style="display: flex; gap: 16px; align-items: flex-start">
<div style="width: 180px; flex-shrink: 0; min-height: 44px; display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{sg.color}}"></span>
<span style="font-size: 14px; font-weight: 600">{{sg.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4E545C">{{sg.count}}</span>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{sg.items}}" as="pi" hint-placeholder-count="4">
<a href="#" style="min-height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid {{pi.border}}; background: {{pi.bg}}; border-radius: 999px; color: #15171A; font-size: 14px; font-weight: 500; text-decoration: none">{{pi.title}}<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4E545C">{{pi.year}}</span><sc-if value="{{pi.hasTag}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 6px; border-radius: 4px; background: #E6E8E3; color: #3D434A; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase">{{pi.tag}}</span></sc-if></a>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</sc-if>

</sc-for>
</div>
</section>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1520,"height":1400}}'>
var CAT = {
  y1: ['Batman: Year One', '1987'], lh: ['The Long Halloween', '1996–97'], dv: ['Dark Victory', '1999–2000'],
  hk: ['Haunted Knight', '1996'], wir: ['Catwoman: When in Rome', '2004–05'], mwl: ['Batman: The Man Who Laughs', '2005'],
  mm: ['Batman and the Monster Men', '2006'], mad: ['Batman and the Mad Monk', '2006–07'],
  dkr: ['The Dark Knight Returns', '1986'], ba: ['Daredevil: Born Again', '1986'], ronin: ['Ronin', '1983–84'],
  ea: ['Elektra: Assassin', '1986–87'], scg: ['Sin City: The Hard Goodbye', '1991–92'], mwf: ['Daredevil: The Man Without Fear', '1993'],
  t300: ['300', '1998'], dksa: ['The Dark Knight Strikes Again', '2001–02'], dk3: ['Dark Knight III: The Master Race', '2015–17'],
  rb: ['Rubber Blanket', '1991–93'], cog: ['City of Glass', '1994'], ap: ['Asterios Polyp', '2009'],
  crisis: ['Crisis on Infinite Earths', '1985–86'], mos: ['The Man of Steel', '1986'], maus: ['Maus I', '1986'],
  wm: ['Watchmen', '1986–87'], kj: ['Batman: The Killing Joke', '1988'], ditf: ['Batman: A Death in the Family', '1988–89'],
  sfas: ['Superman for All Seasons', '1998'], ddy: ['Daredevil: Yellow', '2001–02'], smb: ['Spider-Man: Blue', '2002–03'],
  hg: ['Hulk: Gray', '2003–04'], cotu: ['Challengers of the Unknown', '1991'],
  c2f: ['Two-Face', 'Character'], cfal: ['Carmine Falcone', 'Character'], ccal: ['Calendar Man', 'Character'],
  ccat: ['Catwoman', 'Character'], crob: ['Dick Grayson', 'Character'],
  lh1: ['The Long Halloween, Part One', '2021 film'], lh2: ['The Long Halloween, Part Two', '2021 film']
};
var NODES = {
  y1: { meta: 'Miller · Mazzucchelli · 1987', desc: "Bruce Wayne's first year as Batman, told alongside Jim Gordon's first year in Gotham.", groups: [
    ['Essential', 'Start here', 'ess', ['lh', 'dv', 'hk', 'wir', 'mwl', 'mm', 'mad']],
    ['Recommended', 'Worth reading next', 'rec', ['dkr', 'ba', 'ronin', 'ea', 'scg', 'mwf', 't300', 'dksa']],
    ['Optional', 'If you want to go further', 'opt', ['rb', 'cog', 'ap']] ] },
  lh: { meta: 'Loeb · Sale · 1996–97', desc: 'A year-long mystery as a killer strikes Gotham on each holiday.', groups: [
    ['Story order', 'Set around this story', 'seq', ['y1', 'dv', 'wir']],
    ['Same team', 'Jeph Loeb & Tim Sale', 'team', ['hk', 'sfas', 'ddy', 'smb', 'hg', 'cotu']],
    ['Characters', 'Featured in this story', 'char', ['c2f', 'cfal', 'ccal', 'ccat']],
    ['Adaptations', 'Animated films', 'char', ['lh1', 'lh2']] ] },
  dv: { meta: 'Loeb · Sale · 1999–2000', desc: 'The sequel to The Long Halloween, introducing Dick Grayson as Robin.', groups: [
    ['Story order', 'Set around this story', 'seq', ['y1', 'lh']],
    ['Same team', 'Jeph Loeb & Tim Sale', 'team', ['hk', 'sfas', 'ddy', 'smb', 'hg']],
    ['Characters', 'Featured in this story', 'char', ['crob', 'c2f']] ] },
  dkr: { meta: 'Miller · 1986', desc: 'An aging Bruce Wayne comes out of retirement in a near-future Gotham.', groups: [
    ['Story order', 'Sequels', 'seq', ['dksa', 'dk3']],
    ['Same writer', 'Frank Miller', 'team', ['y1', 'ba', 'ronin', 'ea', 'scg', 'mwf', 't300']],
    ['Same era', 'Published 1985–89', 'era', ['wm', 'crisis', 'mos', 'maus']] ] }
};
var KIND = {
  seq: { color: '#2747C9', badge: '#2747C9' },
  team: { color: '#C2541A', badge: '#9A3F0E' },
  era: { color: '#6B7179', badge: '#4E545C' },
  char: { color: '#1F7A6B', badge: '#1F6F63' },
  ess: { color: '#15171A', badge: '#15171A' },
  rec: { color: '#2747C9', badge: '#2747C9' },
  opt: { color: '#6B7179', badge: '#4E545C' }
};
var CAP = 3;
function linkCount(id) { var n = 0; NODES[id].groups.forEach(function (g) { n += g[3].length; }); return n; }

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var trail = st.trail || ['y1'];
    var focus = trail[trail.length - 1];
    var node = NODES[focus];
    var open = ('open' in st) ? st.open : (focus === 'y1' ? 'lh' : null);
    var more = st.more || {};
    var inTrail = {};
    trail.forEach(function (id) { inTrail[id] = true; });
    var onMap = {};
    node.groups.forEach(function (g) { g[3].forEach(function (id) { onMap[id] = true; }); });

    function chip(id) {
      var c = CAT[id];
      var isOpen = id === open;
      var exp = !!NODES[id] && !inTrail[id];
      return {
        isChip: true, isMore: false, isPanel: false,
        title: c[0], year: c[1], expandable: exp, isOpen: isOpen,
        bg: isOpen ? '#15171A' : '#FFFFFF', fg: isOpen ? '#FFFFFF' : '#15171A',
        sub: isOpen ? '#C9CEC6' : '#4E545C', border: isOpen ? '#15171A' : '#DDE0DA',
        btnFg: isOpen ? '#FFFFFF' : '#2747C9', ariaExp: isOpen ? 'true' : 'false',
        expLabel: isOpen ? 'Collapse' : ('Expand · ' + (exp ? linkCount(id) : 0)),
        hasTag: !!inTrail[id], tag: 'Came from',
        toggle: function () { self.setState({ open: isOpen ? null : id }); }
      };
    }
    function panel(id, col, fromLabel) {
      var pn = NODES[id];
      return {
        isChip: false, isMore: false, isPanel: true,
        title: CAT[id][0], count: linkCount(id), from: fromLabel, col: col, gapPx: col * 12,
        groups: pn.groups.map(function (g) {
          return {
            label: g[0], color: KIND[g[2]].color, count: g[3].length,
            items: g[3].map(function (x) {
              var tag = x === focus ? 'This card' : (inTrail[x] ? 'Came from' : (onMap[x] ? 'On map' : ''));
              return { title: CAT[x][0], year: CAT[x][1], hasTag: !!tag, tag: tag,
                bg: tag ? '#F5F6F3' : '#FFFFFF', border: tag ? '#DDE0DA' : '#C9CEC6' };
            })
          };
        }),
        close: function () { self.setState({ open: null }); },
        focus: function () { self.setState({ trail: trail.concat(id), open: null }); }
      };
    }

    var placed = false;
    var groups = node.groups.map(function (g, gi) {
      var k = KIND[g[2]];
      var ids = g[3];
      var key = focus + ':' + gi;
      var forced = !!open && ids.indexOf(open) >= CAP;
      var full = !!more[key] || forced;
      var vis = full ? ids : ids.slice(0, CAP);
      var cells = vis.map(chip);
      if (!full && ids.length > CAP) {
        cells.push({ isChip: false, isMore: true, isPanel: false, more: ids.length - CAP, count: ids.length,
          expand: function () { var m = Object.assign({}, more); m[key] = true; self.setState({ more: m }); } });
      }
      var idx = open ? vis.indexOf(open) : -1;
      if (idx !== -1 && !placed) {
        placed = true;
        var at = Math.min((Math.floor(idx / 4) + 1) * 4, cells.length);
        cells.splice(at, 0, panel(open, idx % 4, g[0]));
      }
      return {
        label: g[0], sub: g[1], color: k.color, badge: k.badge, count: ids.length, cells: cells,
        canCollapse: !!more[key] && !forced && ids.length > CAP,
        collapse: function () { var m = Object.assign({}, more); m[key] = false; self.setState({ more: m }); }
      };
    });
    var n = groups.length;
    groups.forEach(function (g, i) {
      var last = i === n - 1;
      if (i === 0) { g.trunkTop = '28px'; g.trunkH = last ? '0px' : 'calc(100% + 4px)'; }
      else { g.trunkTop = '0px'; g.trunkH = last ? '28px' : 'calc(100% + 32px)'; }
    });

    var crumbs = trail.map(function (id, i) {
      var isLast = i === trail.length - 1;
      return {
        title: CAT[id][0], isLast: isLast, notLast: !isLast, notFirst: i > 0,
        go: function () { self.setState({ trail: trail.slice(0, i + 1), open: trail[i + 1] || null }); }
      };
    });

    return {
      crumbs: crumbs, groups: groups,
      focusTitle: CAT[focus][0], focusMeta: node.meta, focusDesc: node.desc, focusCount: linkCount(focus)
    };
  }
}
</script>
</body>
</html>
