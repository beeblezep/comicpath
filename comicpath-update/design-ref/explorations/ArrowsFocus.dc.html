</sc-if>
<div style="position: absolute; left: 64px; top: 204px; font-size: 14px; font-weight: 700; color: #D3301F">Reading path A</div>
<div style="position: absolute; left: 412px; top: 768px; font-size: 14px; font-weight: 700; color: #D3301F">Reading path B</div>
<div style="position: absolute; left: 392px; top: 430px; width: 120px; text-align: center; font-size: 13px; line-height: 16px; color: #3D434A; opacity: {{o.e4}}">Directly follows</div>
<div style="position: absolute; left: 1084px; top: 772px; width: 84px; font-size: 13px; line-height: 16px; color: #3D434A; opacity: {{o.e8}}">Leads up to</div>
<div style="position: absolute; left: 716px; top: 956px; width: 140px; text-align: center; font-size: 13px; line-height: 16px; color: #3D434A; opacity: {{o.e9}}">Should read before</div>
<div style="position: absolute; left: 932px; top: 1128px; width: 120px; text-align: center; font-size: 13px; line-height: 16px; color: #3D434A; opacity: {{o.e12}}">Directly follows</div>
<div style="position: absolute; left: 1160px; top: 808px; font-size: 17px; font-style: italic; opacity: {{o.deco}}">Major event / Story arc</div>
<div style="position: absolute; left: 1060px; top: 236px; font-size: 20px; opacity: {{o.deco}}">Character</div>
<div style="position: absolute; left: 64px; top: 1016px; font-size: 20px; opacity: {{o.deco}}">Character</div>
<a href="#" style="position: absolute; left: 1352px; top: 1144px; font-size: 14px">Show skipped titles</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1220}}'>
var CARDS = { c1: 'Title 1', c2: 'Title 2', w1: 'Title 3', c3: 'Title 4', w2: 'Title 5', c4: 'Title 6', b1: 'Title 7', b2: 'Title 8',
  s1: 'Title 9', m1: 'Title 10', m2: 'Title 11', w3: 'Title 12', d1: 'Title 13', d2: 'Title 14' };
var EDGES = [
  ['e1', 'c1', 'c2', 'path'], ['e2', 'c2', 'c3', 'path'], ['e3', 'c3', 'c4', 'path'], ['e4', 'c2', 'w1', 'rec'],
  ['e5', 'c4', 'b1', 'path'], ['e6a', 'b1', 'b2', 'rec'], ['e6b', 'b1', 'b2', 'path'], ['e7', 'b2', 'm1', 'path'],
  ['e8', 'b2', 'm1', 'enh'], ['e9', 's1', 'm1', 'enh'], ['e10a', 'm1', 'm2', 'rec'], ['e10b', 'm1', 'm2', 'path'],
  ['e11', 'm1', 'd1', 'enh'], ['e12', 'd1', 'd2', 'rec']
];
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var sel = ('sel' in st) ? st.sel : 'm1';
    var o = {}, k = {}, r = {}, p = {};
    var linked = {};
    var before = {}, after = {};
    function note(map, id, type) {
      if (type === 'enh') { if (!map[id]) map[id] = 'enh'; }
      else map[id] = 'strong';
    }
    EDGES.forEach(function (e) {
      var on = !sel || e[1] === sel || e[2] === sel;
      o[e[0]] = on ? '1' : '0.12';
      if (sel && e[2] === sel) { linked[e[1]] = true; note(before, e[1], e[3]); }
      if (sel && e[1] === sel) { linked[e[2]] = true; note(after, e[2], e[3]); }
    });
    Object.keys(CARDS).forEach(function (id) {
      o[id] = (!sel || id === sel || linked[id]) ? '1' : '0.35';
      r[id] = id === sel ? '0 0 0 4px rgba(39, 71, 201, 0.35)' : 'none';
      p[id] = id === sel ? 'true' : 'false';
      k[id] = function () { self.setState({ sel: id === sel ? null : id }); };
    });
    o.deco = sel ? '0.35' : '1';
    function list(map) {
      var ids = Object.keys(map);
      if (!ids.length) return 'nothing';
      return ids.map(function (id) { return CARDS[id] + (map[id] === 'enh' ? ' (optional)' : ''); }).join(', ');
    }
    var summary;
    if (!sel) summary = 'Select a card to see what to read before and after it.';
    else if (!Object.keys(linked).length) summary = CARDS[sel] + ' is a standalone story, with no reading order around it.';
    else summary = CARDS[sel] + ' · Read before: ' + list(before) + ' · Read after: ' + list(after);
    return { o: o, k: k, r: r, p: p, summary: summary, hasSel: !!sel,
      bgClear: function (e) { var t = e && e.target; if (t && t.closest && t.closest('button, a, svg[style*="cursor: pointer"]')) return; clearTimeout(self._leave); self.setState({ sel: null, pin: null, hover: null }); },
      clear: function () { self.setState({ sel: null }); } };
  }
}
</script>
</body>
</html>
